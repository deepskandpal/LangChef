[project]
name = "langchef"
version = "0.1.0"
description = "An installed eval engineer — a scheduled agent that maintains online evals and experiment analysis on infrastructure you already own."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.14"
authors = [{ name = "Deepak Kandpal" }]
keywords = ["evaluation", "llm-as-judge", "judge-calibration", "experimentation", "agents", "mlops"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "typer>=0.15,<1.0",
  # M1 brings the numerical stack in deliberately (DECISIONS.md #7).
  "numpy>=2.1,<3",
  "scipy>=1.14,<2",
  # DECISIONS.md #4 — parquet for bulk per-example scores only.
  "pyarrow>=18,<22",
]

[project.optional-dependencies]
# One shim, one dependency (DECISIONS.md #6). Kept out of the base install so
# the CLI and its statistics work with no provider SDK present at all.
providers = ["litellm>=1.55,<2"]

[project.urls]
Homepage = "https://github.com/deepskandpal/langchef"
Source = "https://github.com/deepskandpal/langchef"

[project.scripts]
langchef = "langchef.cli.main:app"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.8",
  # Independent implementation for the known-answer tests (DECISIONS.md #7).
  # A test dependency on purpose: core hand-rolls every statistic it ships.
  "scikit-learn>=1.5,<2",
  # The providers extra, installed for the suite and not for users, so that the
  # litellm path is executed rather than skipped in CI (#31). It still costs
  # nothing and touches no network: tests/test_litellm_path.py replaces the
  # socket with a recorded transport, and verify.sh step 1 still asserts that no
  # provider credential is present before any of it runs.
  "langchef[providers]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/langchef"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Holds the agent contract's prose and markdown tables verbatim; wrapping them
# would change the rendered document.
"scripts/render_contract.py" = ["E501"]
# Holds the documentation site's prose and its preformatted code samples
# verbatim. Whitespace inside <pre> is significant, so wrapping these lines
# would change the rendered page.
"scripts/build_docs.py" = ["E501"]
# A data table. One fact per line reads as a table and diffs as one; wrapping
# each tuple across four lines would hide the shape of the corpus.
"dogfood/corpus.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# The dogfood lives at the repository root rather than in src/, because it is a
# thing under test, not a thing we ship.
pythonpath = ["."]
