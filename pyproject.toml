[project]
name = "langchef"
version = "0.1.0"
description = "An installed eval engineer — a scheduled agent that maintains online evals and experiment analysis on infrastructure you already own."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.14"
authors = [{ name = "Deepak Kandpal" }]
keywords = ["evaluation", "llm-as-judge", "judge-calibration", "experimentation", "agents", "mlops"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "typer>=0.15,<1.0",
]

[project.urls]
Homepage = "https://github.com/deepskandpal/langchef"
Source = "https://github.com/deepskandpal/langchef"

[project.scripts]
langchef = "langchef.cli.main:app"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/langchef"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Holds the agent contract's prose and markdown tables verbatim; wrapping them
# would change the rendered document.
"scripts/render_contract.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
